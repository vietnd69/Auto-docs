[project]
name = "mod-document-harness"
version = "0.1.0"
description = "OpenCode + Harness² documentation harness for DST Lua scripts"
requires-python = ">=3.11"
dependencies = [
    "mod-document-llm",
    "mcp>=1.9,<3",
    "httpx>=0.27",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "python-frontmatter>=1.1",
]

[project.scripts]
mod-harness = "harness.cli:main"
dst-tools-mcp = "harness.mcp_server:main"
ollama-proxy = "harness.proxy:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../llm/src", "tests"]
addopts = "--import-mode=importlib -m 'not e2e'"
markers = ["e2e: end-to-end tests that need API keys, OpenCode and network"]

[tool.coverage.run]
branch = true
source = ["harness"]
omit = []

[tool.coverage.report]
fail_under = 85
show_missing = true

# ISO/IEC 5055 → static quality rules (see docs/2026-10-25-opencode-harness-design.md §3.2)
[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "S", "PL", "RUF"]
# PLC0415: deliberate lazy imports (break runner↔improve cycle, optional mcp/uvicorn/llm deps)
# RUF001: intentional typographic characters (×, …, ≈) in tool output
ignore = ["PLR2004", "S603", "S607", "PLC0415", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["harness"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 7
max-statements = 60
max-branches = 12

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["harness"]

[[tool.mypy.overrides]]
module = ["frontmatter", "llm.*"]
ignore_missing_imports = true
