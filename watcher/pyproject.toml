[project]
name = "mod-document-watcher"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mod-document-rag",
]

[project.scripts]
mod-watcher = "watcher.diff:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
